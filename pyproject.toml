[project]
name = "cre-kit"
version = "0.1.0"
description = "Interview a machine, fill a config, and build + register a Snowflake Custom Runtime Environment (CRE), with a self-correcting watcher/runner loop."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# Only needed for the smoke test stage (submits an ML Job against the CRE).
smoke = ["snowflake-ml-python>=1.37.0"]
dev = ["pytest>=8"]

[project.scripts]
cre = "cre_kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cre_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
